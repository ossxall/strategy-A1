# Docker Compose para bot1: colector (live/feed/) + bot de señales.
# =============================================================================
# - Ambos servicios comparten la imagen y un volumen con feed.db y signal.db.
# - `feed` escribe feed.db (WAL); `bot` solo lee feed.db y escribe signal.db.
# - Resiliencia: `restart: unless-stopped`, `init: true`, healthchecks reales
#   y límites de log. El bot solo espera a que el contenedor del feed ARRANQUE
#   (`service_started`), no a que esté sano: el paquete bot tolera que feed.db falte o
#   esté vacío y reintenta cada POLL_SECONDS, así que nunca queda bloqueado si
#   el feed tarda o queda unhealthy.
#
# Uso (desde ./bot1):
#   docker compose up -d --build
#   docker compose ps
#   docker compose logs -f bot
#   docker compose down            # detiene y mantiene el volumen de datos
#
# La raíz define FEED_*; live/.env conserva la configuración del bot.

name: blacker-bot1

x-common: &common
  build:
    context: .
    # Se pasan solo los paquetes de estrategia y bot; no se envía al daemon
    # todo el directorio padre (incluye data/).
    additional_contexts:
      strategy: ../strategy
  image: blacker-bot1:latest
  working_dir: /app/legacy/bot1
  env_file:
    - ../.env
    - .env
  volumes:
    - bot_data:/data
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  feed:
    <<: *common
    command: ["python", "-m", "feed"]
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Absoluto para que el colector y el paquete bot compartan la base de datos.
      DB_PATH: /data/feed.db
      FEED_DB_PATH: /data/feed.db
      FEED_STATUS_HOST: 0.0.0.0
      FEED_STATUS_PORT: "8787"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "feed"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  bot:
    <<: *common
    command: ["python", "-m", "bot"]
    volumes:
      - bot_data:/data
      - bot_reports:/app/legacy/bot1/bot/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      feed:
        # Solo orden de arranque, no salud: el bot arranca igual y espera datos.
        condition: service_started
    environment:
      DB_PATH: /data/feed.db
      SIGNAL_DB: /data/signal.db
      BACKTEST_REPORT_DIR: /app/legacy/bot1/bot/data/backtest_out
      BOT_HEARTBEAT: /data/bot1.heartbeat
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      LIVE_ONLY: "true"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "bot"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  bot_data:
    name: blacker-bot1-data
  bot_reports:
    name: blacker-bot1-reports
