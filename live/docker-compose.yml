# Docker Compose para bot1: colector + estrategia de señales + consumidor Futures.
# =============================================================================
# - Los servicios comparten ./data (live/data en el host), montado como /data.
# - `feed` escribe feed.db (WAL); `bot` solo lee feed.db y escribe signal.db.
# - `executor` consume signal.db y registra su estado por cuenta; trading está
#   desactivado por defecto en `live/.env.dev`.
# - Resiliencia: `restart: unless-stopped`, `init: true`, healthchecks reales
#   y límites de log. El bot solo espera a que el contenedor del feed ARRANQUE
#   (`service_started`), no a que esté sano: el paquete bot tolera que feed.db falte o
#   esté vacío y reintenta cada POLL_SECONDS, así que nunca queda bloqueado si
#   el feed tarda o queda unhealthy.
#
# Uso (desde ./live):
#   APP_ENV=dev docker-compose --env-file .env.dev -p blacker-bot1 up -d --build
#   APP_ENV=dev docker-compose --env-file .env.dev -p blacker-bot1 ps
#   APP_ENV=dev docker-compose --env-file .env.dev -p blacker-bot1 logs -f bot
#   APP_ENV=dev docker-compose --env-file .env.dev -p blacker-bot1 down  # conserva live/data
#
# `feed`, `bot` y `executor` usan el perfil indicado por APP_ENV (.env.prod o,
# por defecto, .env.dev). `monitor` recibe únicamente las variables MONITOR_*.
# Los datos persistentes se guardan en live/data y no se incluyen en la imagen.

version: "2.4"

x-common: &common
  build:
    context: ..
    dockerfile: live/Dockerfile
  image: blacker-bot1:latest
  working_dir: /app/legacy/bot1
  volumes:
    - ./data:/data
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  feed:
    <<: *common
    env_file:
      - .env.${APP_ENV:-dev}
    command: ["python", "-m", "feed"]
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Absoluto para que el colector y el paquete bot compartan la base de datos.
      DB_PATH: /data/feed.db
      FEED_DB_PATH: /data/feed.db
      FEED_STATUS_HOST: 0.0.0.0
      FEED_STATUS_PORT: "8787"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "feed"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  bot:
    <<: *common
    env_file:
      - .env.${APP_ENV:-dev}
    command: ["python", "-m", "bot"]
    volumes:
      - ./data:/data
      - bot_reports:/app/legacy/bot1/bot/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      feed:
        # Solo orden de arranque, no salud: el bot arranca igual y espera datos.
        condition: service_started
    environment:
      BOT_DB_PATH: /data/feed.db
      BOT_SIGNAL_DB: /data/signal.db
      BOT_BACKTEST_REPORT_DIR: /app/legacy/bot1/bot/data/backtest_out
      BOT_HEARTBEAT: /data/bot1.heartbeat
      BOT_HTTP_HOST: 0.0.0.0
      BOT_HTTP_PORT: "8080"
      BOT_LIVE_ONLY: "true"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  executor:
    <<: *common
    env_file:
      - .env.${APP_ENV:-dev}
    command: ["python", "-m", "bot.execution"]
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      bot:
        condition: service_started
    environment:
      BOT_SIGNAL_DB: /data/signal.db
      BOT_EXECUTOR_HEARTBEAT: /data/executor.heartbeat
      BOT_EXECUTOR_HTTP_HOST: 0.0.0.0
      BOT_EXECUTOR_HTTP_PORT: "8081"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "executor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  monitor:
    <<: *common
    command: ["python", "-m", "monitor"]
    volumes:
      - ./monitor/config.yaml:/app/legacy/bot1/monitor/config.yaml:ro
    environment:
      MONITOR_TELEGRAM_BOT_TOKEN: ${MONITOR_TELEGRAM_BOT_TOKEN:?Define MONITOR_TELEGRAM_BOT_TOKEN en el perfil de entorno}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:?Define MONITOR_PASSWORD en el perfil de entorno}
      MONITOR_FEED_URL: ${MONITOR_FEED_URL:-http://feed:8787/live/feed/health}
      MONITOR_BOT_URL: ${MONITOR_BOT_URL:-http://bot:8080/live/bot/health}
      MONITOR_EXECUTOR_URL: ${MONITOR_EXECUTOR_URL:-http://executor:8081/live/bot/execution/status}
    depends_on:
      feed:
        condition: service_started
      bot:
        condition: service_started
      executor:
        condition: service_started
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      feed:
        condition: service_started
      bot:
        condition: service_started
      executor:
        condition: service_started
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot_reports:
    name: blacker-bot1-reports
