# Docker Compose para bot1: colector + estrategia de señales + consumidor Futures.
# =============================================================================
# - Los servicios comparten ./data (live/data en el host), montado como /data.
# - `feed` escribe feed.db (WAL); `bot` solo lee feed.db y escribe signal.db.
# - `executor` consume signal.db y registra su estado por cuenta; dev mantiene
#   trading desactivado y prod lo habilita explícitamente en config.prod.yaml.
# - Resiliencia: `restart: unless-stopped`, `init: true`, healthchecks reales
#   y límites de log. El bot solo espera a que el contenedor del feed ARRANQUE
#   (`service_started`), no a que esté sano: el paquete bot tolera que feed.db falte o
#   esté vacío y reintenta cada POLL_SECONDS, así que nunca queda bloqueado si
#   el feed tarda o queda unhealthy.
#
# Uso (desde ./live):
#   cp .env.example .env.dev  # rellena secretos de desarrollo solo en la copia
#   APP_ENV=dev docker-compose --env-file .env.dev -f docker-compose.yml -f docker-compose.runtime.yml -p blacker-bot1 up -d --build
#   APP_ENV=dev docker-compose --env-file .env.dev -f docker-compose.yml -f docker-compose.runtime.yml -p blacker-bot1 ps
#   APP_ENV=dev docker-compose --env-file .env.dev -f docker-compose.yml -f docker-compose.runtime.yml -p blacker-bot1 logs -f bot
#   docker-compose -f docker-compose.yml -p blacker-bot1 down  # sin perfiles ni secretos
#
# config.dev.yaml es la base; APP_ENV=prod aplica config.prod.yaml encima.
# Compose solo pasa los secretos privados requeridos por cada servicio.
# Los datos persistentes se guardan en live/data y no se incluyen en la imagen.

version: "2.4"

x-common: &common
  build:
    context: ..
    dockerfile: live/Dockerfile
  image: blacker-bot1:latest
  working_dir: /app/legacy/bot1
  volumes:
    - ./data:/data
  environment:
    APP_ENV: ${APP_ENV:-dev}
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  feed:
    <<: *common
    command: ["python", "-m", "feed"]
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Absoluto para que el colector y el paquete bot compartan la base de datos.
      DB_PATH: /data/feed.db
      FEED_DB_PATH: /data/feed.db
      FEED_STATUS_HOST: 0.0.0.0
      FEED_STATUS_PORT: "8787"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "feed"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  bot:
    <<: *common
    command: ["python", "-m", "bot"]
    volumes:
      - ./data:/data
      - bot_reports:/app/legacy/bot1/bot/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      feed:
        # Solo orden de arranque, no salud: el bot arranca igual y espera datos.
        condition: service_started
    environment:
      BOT_DB_PATH: /data/feed.db
      BOT_SIGNAL_DB: /data/signal.db
      BOT_BACKTEST_REPORT_DIR: /app/legacy/bot1/bot/data/backtest_out
      BOT_HEARTBEAT: /data/bot1.heartbeat
      BOT_HTTP_HOST: 0.0.0.0
      BOT_HTTP_PORT: "8080"
      BOT_LIVE_ONLY: "true"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "bot"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  executor:
    <<: *common
    command: ["python", "-m", "bot.execution"]
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      bot:
        condition: service_started
    environment:
      BOT_SIGNAL_DB: /data/signal.db
      BOT_EXECUTOR_HEARTBEAT: /data/executor.heartbeat
      BOT_EXECUTOR_HTTP_HOST: 0.0.0.0
      BOT_EXECUTOR_HTTP_PORT: "8081"
      BOT_BINANCE_ACCOUNT_ID: ${BOT_BINANCE_ACCOUNT_ID:-}
      BOT_BINANCE_API_KEY: ${BOT_BINANCE_API_KEY:-}
      BOT_BINANCE_API_SECRET: ${BOT_BINANCE_API_SECRET:-}
      BOT_BINANCE_PRODUCTION_AUDIT_API_KEY: ${BOT_BINANCE_PRODUCTION_AUDIT_API_KEY:-}
      BOT_BINANCE_PRODUCTION_AUDIT_API_SECRET: ${BOT_BINANCE_PRODUCTION_AUDIT_API_SECRET:-}
    healthcheck:
      test: ["CMD", "python", "healthcheck.py", "executor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  webssh:
    <<: *common
    command: ["python", "ssh/start_webssh.py"]
    volumes:
      - ./ssh/known_hosts:/root/.ssh/known_hosts:ro
    environment:
      WEBSSH_HOST: 0.0.0.0
      WEBSSH_PORT: "8888"
      # WebSSH sólo se publica detrás de Nginx + Authelia.
      WEBSSH_PUBLIC_URL: https://lovelacers.com/webssh/

  sqlweb:
    <<: *common
    command:
      - python
      - sqlweb/start.py
      - --writable
      - --behind-auth-proxy
    volumes:
      - ./data:/data
    environment:
      SQLWEB_DATABASE_DIR: /data
      SQLWEB_HOST: 0.0.0.0
      SQLWEB_PORT: "8082"
      SQLWEB_URL_PREFIX: /sqlweb
      # Sin password local por ahora: el acceso público queda detrás de Authelia.
      SQLITE_WEB_PASSWORD: ${SQLITE_WEB_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  monitor:
    <<: *common
    command: ["python", "-m", "monitor"]
    volumes:
      - ./monitor/config.yaml:/app/legacy/bot1/monitor/config.yaml:ro
    environment:
      # El teardown no debe exigir secretos; monitor/config.py los valida al arrancar.
      MONITOR_TELEGRAM_BOT_TOKEN: ${MONITOR_TELEGRAM_BOT_TOKEN:-}
      MONITOR_PASSWORD: ${MONITOR_PASSWORD:-}
      MONITOR_FEED_URL: ${MONITOR_FEED_URL:-http://feed:8787/live/feed/health}
      MONITOR_BOT_URL: ${MONITOR_BOT_URL:-http://bot:8080/live/bot/health}
      MONITOR_EXECUTOR_URL: ${MONITOR_EXECUTOR_URL:-http://executor:8081/live/bot/execution/status}
    depends_on:
      feed:
        condition: service_started
      bot:
        condition: service_started
      executor:
        condition: service_started
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL

  glances:
    <<: *common
    command:
      - python
      - glances/start_web.py
      - --bind
      - 0.0.0.0
      - --port
      - "61208"
    # Acceso de solo lectura a recursos del host; no monta los datos de trading.
    volumes:
      - /:/rootfs:ro,rslave
      - /sys:/sys:ro
      - /etc/os-release:/etc/os-release:ro
    # Permite enumerar procesos del host, no solo los del contenedor.
    pid: host

  dozzle:
    image: amir20/dozzle:v11.4.3-alpine
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9999:8080"
    environment:
      DOZZLE_BASE: /logs

  authelia:
    image: authelia/authelia:4.39.28
    user: "${AUTHELIA_UID:-1000}:${AUTHELIA_GID:-1000}"
    restart: unless-stopped
    networks:
      - auth_egress
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./authelia/users_database.yml:/config/users_database.yml:ro
      - ./authelia/data:/data
      - ./authelia/secrets:/run/secrets:ro
    environment:
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/storage_encryption_key
    depends_on:
      redis:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  certbot:
    image: certbot/certbot:v5.10.0
    profiles:
      - certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command:
      - certonly
      - --webroot
      - --webroot-path
      - /var/www/certbot
      - --keep-until-expiring
      - --email
      - ${LETSENCRYPT_EMAIL:-}
      - --agree-tos
      - --no-eff-email
      - --non-interactive
      - --domain
      - lovelacers.com

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    networks:
      - auth_egress
    volumes:
      - authelia_sessions:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.30.6-alpine
    networks:
      - default
      - auth_egress
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      feed:
        condition: service_started
      bot:
        condition: service_started
      executor:
        condition: service_started
      webssh:
        condition: service_started
      sqlweb:
        condition: service_started
      glances:
        condition: service_started
      authelia:
        condition: service_started
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot_reports:
    name: blacker-bot1-reports
  authelia_sessions:
    name: blacker-bot1-authelia-sessions

networks:
  auth_egress:
    # Dedicated to nginx, Authelia, and Redis. It is not attached to the
    # application containers and permits Authelia's outbound DNS/NTP checks.
    driver: bridge
