worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=live_api:10m rate=10r/s;
    limit_req_status 429;

    server {
        listen 80 default_server;
        server_name lovelacers.com;

        server_tokens off;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://lovelacers.com$request_uri;
        }
    }

    server {
        listen 443 ssl http2 default_server;
        server_name lovelacers.com;

        server_tokens off;
        ssl_certificate /etc/letsencrypt/live/lovelacers.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lovelacers.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /internal/authelia/authz {
            internal;
            proxy_pass http://authelia:9091/api/authz/auth-request;
            proxy_set_header Host $host;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-URL $scheme://$host$request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-URI $request_uri;
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";
            proxy_pass_request_body off;
            proxy_http_version 1.1;
        }

        location = /auth {
            return 301 /auth/;
        }

        location ^~ /auth/ {
            proxy_pass http://authelia:9091;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-URI $request_uri;
        }

        location = /logs {
            return 301 /logs/;
        }

        location ^~ /logs/ {
            include /etc/nginx/snippets/authelia-authrequest.conf;
            proxy_pass http://dozzle:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /live/feed/ {
            limit_req zone=live_api burst=20 nodelay;
            include /etc/nginx/snippets/authelia-authrequest.conf;
            proxy_pass http://feed:8787;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location ^~ /live/bot/execution/ {
            limit_req zone=live_api burst=20 nodelay;
            include /etc/nginx/snippets/authelia-authrequest.conf;
            proxy_pass http://executor:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location ^~ /live/bot/ {
            limit_req zone=live_api burst=20 nodelay;
            include /etc/nginx/snippets/authelia-authrequest.conf;
            proxy_pass http://bot:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        location / {
            return 404;
        }
    }
}
