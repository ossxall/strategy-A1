<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    >
    <title>Strategy A1</title>
    <style>
      :root,
      :root[data-theme="light"] {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--page-bg);
        font-synthesis: none;
        text-rendering: optimizeLegibility;

        --page-bg: #f3f6fa;
        --surface: #fff;
        --text: #182230;
        --muted: #7a8798;
        --subtle: #687689;
        --border: #e4e9f0;
        --divider: #f0f2f5;
        --hover-bg: #f8faff;
        --hover-text: #344257;
        --accent: #245fc9;
        --brand-bg: #e9f1ff;
        --brand-text: #2864d7;
        --indicator-shadow: #e7f6ee;
        --card-shadow: 0 12px 32px rgb(25 42 70 / 6%);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page-bg: #111821;
        --surface: #19232f;
        --text: #e8edf5;
        --muted: #9aa7b7;
        --subtle: #aab5c4;
        --border: #303c4b;
        --divider: #293442;
        --hover-bg: #243142;
        --hover-text: #e0e8f2;
        --accent: #8ab2ff;
        --brand-bg: #263a58;
        --brand-text: #9bbcff;
        --indicator-shadow: #233d34;
        --card-shadow: 0 12px 32px rgb(0 0 0 / 22%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 800px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
      }

      .app-header {
        position: relative;
        z-index: 2;
        height: 124px;
        background: var(--surface);
        box-shadow: 0 1px 0 var(--border);
      }

      .brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 70px;
        padding: 0 32px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 12px;
        background: var(--brand-bg);
        color: var(--brand-text);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: -1px;
      }

      .brand-name {
        margin: 0;
        font-size: 15px;
        font-weight: 750;
        letter-spacing: -0.2px;
      }

      .brand-caption {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 11px;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .local-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 11px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--subtle);
        font-size: 11px;
        font-weight: 600;
      }

      .local-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #34a875;
        box-shadow: 0 0 0 3px var(--indicator-shadow);
      }

      .theme-toggle {
        display: inline-flex;
        min-height: 34px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 11px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 11px;
        font-weight: 650;
        transition: background 120ms ease, border-color 120ms ease;
      }

      .theme-toggle:hover {
        border-color: var(--accent);
        background: var(--hover-bg);
      }

      .theme-toggle:focus-visible,
      .system-tab:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .theme-toggle svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      :root[data-theme="light"] .theme-icon-sun,
      :root[data-theme="dark"] .theme-icon-moon {
        display: none;
      }

      .tab-row {
        display: flex;
        align-items: stretch;
        height: 54px;
        gap: 4px;
        padding: 0 24px;
        border-top: 1px solid var(--divider);
      }

      .system-tabs {
        display: flex;
        align-items: stretch;
        gap: 4px;
      }

      .system-tab {
        position: relative;
        min-width: 112px;
        padding: 0 15px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 12px;
        font-weight: 650;
        transition: color 120ms ease, background 120ms ease;
      }

      .system-tab:hover {
        background: var(--hover-bg);
        color: var(--hover-text);
      }

      .system-tab[aria-selected="true"] {
        color: var(--accent);
      }

      .system-tab[aria-selected="true"]::after {
        position: absolute;
        right: 14px;
        bottom: 0;
        left: 14px;
        height: 2px;
        border-radius: 2px 2px 0 0;
        background: var(--accent);
        content: "";
      }

      .tab-indicator {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 8px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.62;
        vertical-align: 1px;
      }

      .app-content {
        height: calc(100vh - 124px);
        background: var(--page-bg);
      }

      .message {
        display: none;
        position: absolute;
        z-index: 1;
        inset: 124px 0 0;
        align-items: center;
        justify-content: center;
        padding: 40px;
        background: var(--page-bg);
        text-align: center;
      }

      .message.visible {
        display: flex;
      }

      .message-card {
        max-width: 560px;
        padding: 30px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--card-shadow);
      }

      .message-card h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .message-card p {
        margin: 0;
        color: var(--subtle);
        font-size: 13px;
        line-height: 1.6;
      }

      .config-path {
        display: block;
        margin-top: 14px;
        color: var(--subtle);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 11px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-row">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">A1</div>
          <div>
            <p class="brand-name">Strategy A1</p>
            <p class="brand-caption">Centro de sistemas</p>
          </div>
        </div>
        <div class="header-actions">
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Cambiar a tema oscuro"
            aria-pressed="false"
            title="Cambiar a tema oscuro"
          >
            <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"></path>
            </svg>
            <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            </svg>
            <span id="theme-toggle-label">Tema oscuro</span>
          </button>
          <div class="local-indicator">
            <span class="local-dot" aria-hidden="true"></span>
            Aplicación de escritorio
          </div>
        </div>
      </div>
      <nav class="tab-row" aria-label="Sistemas">
        <div id="system-tabs" class="system-tabs" role="tablist" aria-label="Sistemas configurados"></div>
      </nav>
    </header>

    <main class="app-content" aria-label="Contenido del sistema seleccionado"></main>
    <section id="message" class="message" aria-live="polite">
      <div class="message-card">
        <h2 id="message-title"></h2>
        <p id="message-text"></p>
        <code id="config-path" class="config-path"></code>
      </div>
    </section>

    <script src="./renderer.js"></script>
  </body>
</html>
