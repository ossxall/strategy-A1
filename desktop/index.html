<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    >
    <title>Strategy A1</title>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("./fonts/InterVariable.woff2") format("woff2");
      }

      :root,
      :root[data-theme="light"] {
        color-scheme: light;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--page-bg);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        font-optical-sizing: auto;
        font-feature-settings: "cv11", "ss03";

        --page-bg: #f3f6fa;
        --surface: #fff;
        --text: #182230;
        --muted: #7a8798;
        --subtle: #687689;
        --border: #e4e9f0;
        --divider: #f0f2f5;
        --hover-bg: #f8faff;
        --hover-text: #344257;
        --accent: #245fc9;
        --brand-bg: #e9f1ff;
        --brand-text: #2864d7;
        --indicator-shadow: #e7f6ee;
        --card-shadow: 0 12px 32px rgb(25 42 70 / 6%);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --page-bg: #111821;
        --surface: #19232f;
        --text: #e8edf5;
        --muted: #9aa7b7;
        --subtle: #aab5c4;
        --border: #303c4b;
        --divider: #293442;
        --hover-bg: #243142;
        --hover-text: #e0e8f2;
        --accent: #8ab2ff;
        --brand-bg: #263a58;
        --brand-text: #9bbcff;
        --indicator-shadow: #233d34;
        --card-shadow: 0 12px 32px rgb(0 0 0 / 22%);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 800px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        font-size: 13px;
        font-weight: 400;
        line-height: 20px;
        letter-spacing: -0.003em;
        -webkit-font-smoothing: antialiased;
      }

      .app-layout {
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      .app-sidebar {
        position: relative;
        z-index: 2;
        display: flex;
        width: 76px;
        flex: 0 0 76px;
        flex-direction: column;
        align-items: center;
        padding: 10px 8px;
        border-right: 1px solid var(--border);
        background: var(--surface);
      }

      .brand {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 54px;
        flex-direction: column;
        gap: 3px;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 11px;
        background: var(--brand-bg);
        color: var(--brand-text);
        font-size: 18px;
        font-weight: 700;
        line-height: 24px;
        letter-spacing: -0.014em;
      }

      .brand-name {
        color: var(--muted);
        font-size: 8px;
        font-weight: 600;
        line-height: 10px;
        white-space: nowrap;
      }

      .sidebar-divider {
        width: 36px;
        height: 1px;
        flex: 0 0 auto;
        margin: 8px 0;
        background: var(--divider);
      }

      .sidebar-nav {
        width: 100%;
        min-height: 0;
        flex: 1;
        overflow-y: auto;
        scrollbar-width: none;
      }

      .sidebar-nav::-webkit-scrollbar {
        display: none;
      }

      .system-tabs {
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .system-tab,
      .sidebar-action {
        position: relative;
        display: flex;
        width: 56px;
        height: 43px;
        flex: 0 0 auto;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        transition: color 120ms ease, background 120ms ease, border-color 120ms ease;
      }

      .system-tab:hover,
      .sidebar-action:hover {
        background: var(--hover-bg);
        color: var(--hover-text);
      }

      .system-tab:focus-visible,
      .sidebar-action:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .system-tab[aria-selected="true"] {
        border-color: var(--border);
        background: var(--brand-bg);
        color: var(--brand-text);
      }

      .tab-icon,
      .sidebar-action svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .system-label,
      .action-label,
      .local-label {
        max-width: 52px;
        overflow: hidden;
        font-size: 9px;
        font-weight: 500;
        line-height: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sidebar-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .sidebar-action:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .local-indicator {
        display: flex;
        width: 56px;
        height: 32px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: var(--muted);
      }

      .local-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #34a875;
        box-shadow: 0 0 0 4px var(--indicator-shadow);
      }

      .theme-icon-sun {
        display: none;
      }

      :root[data-theme="light"] .theme-icon-moon {
        display: none;
      }

      :root[data-theme="light"] .theme-icon-sun {
        display: block;
      }

      .sidebar-footer .sidebar-divider {
        margin: 4px 0;
      }

      .app-content {
        min-width: 0;
        flex: 1;
        height: calc(100vh - 24px);
        margin: 12px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--card-shadow);
      }

      .message {
        display: none;
        position: absolute;
        z-index: 1;
        inset: 0 0 0 76px;
        align-items: center;
        justify-content: center;
        padding: 40px;
        background: var(--page-bg);
        text-align: center;
      }

      .message.visible {
        display: flex;
      }

      .message-card {
        max-width: 560px;
        padding: 30px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--card-shadow);
      }

      .message-card h2 {
        margin: 0 0 10px;
        font-size: 18px;
        font-weight: 600;
        line-height: 24px;
        letter-spacing: -0.014em;
      }

      .message-card p {
        margin: 0;
        color: var(--subtle);
        font-size: 14px;
        font-weight: 400;
        line-height: 22px;
        letter-spacing: -0.006em;
      }

      .config-path {
        display: block;
        margin-top: 14px;
        color: var(--subtle);
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 11px;
        font-weight: 400;
        line-height: 16px;
        letter-spacing: 0.005em;
        font-feature-settings: "zero", "ss02";
        overflow-wrap: anywhere;
      }

      .numeric {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div class="app-layout">
      <aside class="app-sidebar" aria-label="Menú principal">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">A1</div>
          <span class="brand-name">Strategy A1</span>
        </div>
        <div class="sidebar-divider" aria-hidden="true"></div>
        <nav class="sidebar-nav" aria-label="Sistemas">
          <div
            id="system-tabs"
            class="system-tabs"
            role="tablist"
            aria-label="Sistemas configurados"
            aria-orientation="vertical"
          ></div>
        </nav>
        <div class="sidebar-footer">
          <button
            id="reload-current"
            class="sidebar-action"
            type="button"
            aria-label="Recargar página actual"
            disabled
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 7v5h-5"></path>
              <path d="M5.64 5.64A9 9 0 0 1 20 12"></path>
              <path d="M4 12a9 9 0 0 0 14.36 6.36"></path>
              <path d="M4 17v-5h5"></path>
            </svg>
            <span class="action-label">Recargar</span>
          </button>
          <button
            id="theme-toggle"
            class="sidebar-action"
            type="button"
            aria-label="Cambiar a tema oscuro"
            aria-pressed="false"
          >
            <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"></path>
            </svg>
            <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            </svg>
            <span id="theme-toggle-label" class="action-label">Tema oscuro</span>
          </button>
          <div class="sidebar-divider" aria-hidden="true"></div>
          <div
            class="local-indicator"
            aria-label="Aplicación de escritorio"
          >
            <span class="local-dot" aria-hidden="true"></span>
            <span class="local-label">Local</span>
          </div>
        </div>
      </aside>

      <main class="app-content" aria-label="Contenido del sistema seleccionado"></main>
    </div>
    <section id="message" class="message" aria-live="polite">
      <div class="message-card">
        <h2 id="message-title"></h2>
        <p id="message-text"></p>
        <code id="config-path" class="config-path"></code>
      </div>
    </section>

    <script src="./node_modules/lucide/dist/umd/lucide.min.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
